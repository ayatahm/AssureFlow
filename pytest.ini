[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
python_files = test_*.py
testpaths = tests
addopts = -ra --strict-markers
markers =
    foundation: Week 3 foundation checks
    auth_verification: full email-code authentication checks (mandatory for release)
    release: release-gate configuration checks
    private_content: requires approved private baseline in private_data/ (never committed)
    e2e: browser journeys (Playwright)
